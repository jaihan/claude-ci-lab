name: AI Code Review Gate

on:
  pull_request:
    branches: [ main, master ]

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Claude Code CLI and jq
        run: |
          npm install -g @anthropic-ai/claude-code
          sudo apt-get update && sudo apt-get install -y jq

      - name: Run AI Code Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # 1. Explicitly fetch base branch
          git fetch origin ${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }} || git fetch origin ${{ github.base_ref }}

          # 2. Capture PR diff against target branch
          git diff origin/${{ github.base_ref }}...HEAD > pr.diff || touch pr.diff

          # 3. Guard against empty diffs
          if [ ! -s pr.diff ]; then
            echo "⚠️ No diff detected between PR branch and origin/${{ github.base_ref }}."
            echo '{"passed": true, "issues": []}' > review.json
          else
            cat pr.diff | claude -p \
              --max-turns 3 \
              --output-format json \
              --json-schema '{
                "type": "object",
                "properties": {
                  "passed": { "type": "boolean" },
                  "issues": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "properties": {
                        "severity": { "type": "string", "enum": ["high", "medium", "low"] },
                        "message": { "type": "string" }
                      },
                      "required": ["severity", "message"]
                    }
                  }
                },
                "required": ["passed", "issues"]
              }' \
              "Review this PR diff. Set passed to false if there are high severity or security issues." \
              > review.json
          fi

          # 4. Print JSON output
          cat review.json | jq .

          # 5. Evaluate CI Gate Result
          if jq -e '.passed == true and ([.issues[] | select(.severity == "high")] | length == 0)' review.json > /dev/null; then
            echo "✅ CI GATE PASSED"
            exit 0
          else
            echo "❌ CI GATE FAILED: High severity issues found."
            exit 1
          fi